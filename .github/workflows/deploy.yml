name: Deploy

# 2단계 워크플로 — 테스트를 통과한 커밋만 앱 서버에 배포한다.
#
# 배포 기준선은 staging 브랜치다. dev 에서 개발하고, 내보낼 준비가 되면 staging 에
# 올린다(merge 또는 push). dev push 마다 배포하면 작업 중인 코드가 그대로 서비스에
# 올라가므로 브랜치를 하나 두어 "지금 배포해도 되는 상태"를 명시적으로 만든다.
#
#   git checkout staging && git merge dev && git push origin staging
#
# workflow_dispatch(수동 실행)는 기본 브랜치인 main 에 이 파일이 올라간 뒤에만
# Actions 탭에 버튼으로 나타난다.
on:
  push:
    branches: [staging]
  workflow_dispatch:

# 배포가 겹치면 jar 교체 도중 재기동이 걸릴 수 있다. 앞선 배포를 끝까지 기다린다.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: 테스트 · 배포
    runs-on: ubuntu-latest

    # CI 와 같은 조건으로 테스트한다 — 통과하지 못하면 배포 단계로 넘어가지 않는다.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: example
          MARIADB_USER: grind
          MARIADB_PASSWORD: ci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: MariaDB 클라이언트 준비
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: 스키마·시드 적용
        run: |
          set -euo pipefail
          files=$(grep 'docker-entrypoint-initdb' docker-compose.yml \
                  | sed 's|.*/db/\([^:]*\):.*|\1|')
          if [ -z "$files" ]; then
            echo "::error::docker-compose.yml 에서 초기화 순서를 읽지 못했습니다."
            exit 1
          fi
          for f in $files; do
            mariadb -h 127.0.0.1 -P 3306 -uroot -pci-root example < "src/main/resources/db/$f"
          done

      - name: 빌드 · 테스트
        run: ./gradlew build --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/example
          SPRING_DATASOURCE_USERNAME: grind
          SPRING_DATASOURCE_PASSWORD: ci-pass
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
          JUDGE0_CLIENT: stub

      - name: SSH 키 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${APP_HOST:-}" ]; then
            echo "::error::Secrets 가 없습니다. 저장소 Settings → Secrets and variables → Actions 에서"
            echo "::error::DEPLOY_SSH_KEY(배포용 개인키)와 APP_HOST(앱 서버 주소)를 등록하세요."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 첫 접속이라 호스트 키를 신뢰 기준 없이 받아 적는다(TOFU).
          # 더 엄격히 하려면 서버의 호스트 키 지문을 Secret 으로 두고 대조할 것.
          ssh-keyscan -H "$APP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "키 준비 완료"

      - name: 업로드 · 교체
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail
          jar=$(ls -t build/libs/*.jar | grep -v -- '-plain\.jar$' | head -1)
          echo "산출물: $(basename "$jar") ($(du -h "$jar" | cut -f1))"

          scp -i ~/.ssh/deploy_key -o BatchMode=yes "$jar" "deployer@$APP_HOST:/tmp/backend.jar"

          # 교체·재기동·기동확인·실패 시 롤백은 서버의 grindalgo-deploy 가 처리한다.
          # 배포 계정이 sudo 로 실행할 수 있는 유일한 명령이라 여기서 임의 명령을 보낼 수 없다.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deployer@$APP_HOST" \
            'sudo /usr/local/bin/grindalgo-deploy backend'

      - name: 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
