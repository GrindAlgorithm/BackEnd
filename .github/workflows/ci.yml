name: CI

# 1단계 워크플로 — 빌드와 테스트만 한다. 배포는 하지 않으므로 서버 접속 정보가 필요 없다.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest

    # contextLoads 테스트가 실제 DB 를 필요로 한다. 운영과 같은 MariaDB 를 띄워
    # 스키마·시드를 그대로 적용하므로, 엔티티와 스키마가 어긋나면 여기서 걸린다.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: example
          MARIADB_USER: grind
          MARIADB_PASSWORD: ci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 스키마·시드 적용
        # 적용 순서를 docker-compose.yml 에서 읽는다 — 파일이 추가돼도 이 워크플로는 그대로 둔다.
        # (FK 의존 때문에 알파벳 순으로는 깨진다)
        run: |
          set -euo pipefail
          files=$(grep 'docker-entrypoint-initdb' docker-compose.yml \
                  | sed 's|.*/db/\([^:]*\):.*|\1|')
          echo "적용할 파일 $(echo "$files" | wc -l)개"
          for f in $files; do
            echo "  → $f"
            mariadb -h 127.0.0.1 -P 3306 -uroot -pci-root example < "src/main/resources/db/$f"
          done

      - name: 빌드 · 테스트
        run: ./gradlew build --no-daemon
        env:
          # 프로필 파일(application-local.yml 등)은 커밋되지 않으므로 접속 정보를 환경변수로 넣는다.
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/example
          SPRING_DATASOURCE_USERNAME: grind
          SPRING_DATASOURCE_PASSWORD: ci-pass
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
          # 채점 서버는 CI 에 없다 — 스텁 클라이언트로 컨텍스트만 뜨게 한다.
          JUDGE0_CLIENT: stub

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
