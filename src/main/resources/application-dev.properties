# 개발(dev) 프로필 — properties 포맷. 실행: ./gradlew bootRun --args='--spring.profiles.active=dev'
# 로컬 Docker MariaDB(docker compose up -d) 기준이라 비밀 값이 없어 커밋 가능하다.
# 오라클 VM DB로 개발하려면 vm 프로필(application-vm.yml, gitignore 대상)을 사용할 것.
spring.datasource.url=jdbc:mariadb://localhost:13306/example
spring.datasource.username=grind
spring.datasource.password=grind-local
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 소셜 로그인 성공 후 프론트(Vite dev)로 복귀
app.oauth2.success-redirect=http://localhost:5173/

# 채점은 스텁(로컬 시뮬레이션) — 실채점은 application-local.yml 의 judge0 설정 참고
judge0.client=stub
